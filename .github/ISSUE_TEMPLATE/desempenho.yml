name: Desempenho
description: FPS baixo, travamento, carga lenta ou memória alta.
title: "perf: "
labels: [desempenho]
body:
  - type: markdown
    attributes:
      value: "O limite de cada métrica (FPS, triângulos, draw calls, carga) está no [orçamento de desempenho](https://github.com/pedrooalvess1-glitch/simulador-normas/blob/main/docs/00_INDICE_E_DECISOES_INFRAESTRUTURA.md#33-orçamento-de-desempenho-critério-de-aceite)."
  - type: textarea
    id: onde
    attributes:
      label: Onde e quando
      description: Ambiente, missão, fase e o que estava na tela.
    validations:
      required: true
  - type: textarea
    id: painel
    attributes:
      label: Painel F3
      description: FPS, draw calls, memória de vídeo e GPU (o agente lê pelo controle da tela).
  - type: input
    id: perfil
    attributes:
      label: Perfil de qualidade e versão
      description: "Ex.: Leve, v0.1.0"
