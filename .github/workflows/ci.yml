# CI. Porteiro do merge: links válidos, Godot fixado e testável, protótipo compilando e texto da norma batendo com o PDF.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  links:
    name: Links internos dos .md
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Testes do verificador de links
        run: python3 tools/test_checar_links.py
      - name: Links internos entre os .md existem
        run: python3 tools/checar_links.py

  godot:
    name: Godot (versão, SHA-512 e gdUnit4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cache do Godot (chave = SHA-512 fixada)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ hashFiles('tools/ambiente/versoes.env') }}
      - name: Baixa o Godot da Release oficial, confere a soma e a versão headless
        run: |
          G="$(tools/ambiente/instalar_godot.sh "$RUNNER_TEMP/godot" | tail -1)"  # falha do script falha o passo
          echo "GODOT=$G" >> "$GITHUB_ENV"
      - name: Testes gdUnit4 da cena de fumaça (prova o addon fixado no runner)
        working-directory: tools/ambiente/fumaca
        run: |
          ../instalar_gdunit4.sh .
          "$GODOT" --headless --path . --import
          GODOT_BIN="$GODOT" addons/gdUnit4/runtest.sh --headless --ignoreHeadlessMode -a res://tests

  prototipo:
    name: Protótipo + conferência no PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dependência da conferência (leitura do PDF)
        run: pip install pypdf

      - name: Build do protótipo e checagem de sintaxe
        working-directory: prototipo
        run: |
          python3 build.py
          node --check bundle.js
          python3 build.py --offline
          test -s simulador-nr10-offline.html

      - name: HTML offline versionado está atualizado
        working-directory: prototipo
        run: |
          if ! cmp -s simulador-nr10-offline.html dist/simulador-nr10-offline.html; then
            echo "::error::prototipo/dist/simulador-nr10-offline.html está desatualizado. Rode 'python3 build.py --offline' e copie para dist/."
            exit 1
          fi

      - name: Itens citados e base REF existem no PDF da Portaria
        run: >
          python3 tools/conferir_itens_portaria.py
          --pdf docs/referencias/portaria-mte-no-737-nova-nr-10.pdf
          --docs docs --refs prototipo --estrito
